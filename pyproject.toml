[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereignty-figures"
version = "0.1.0"
description = "Propulsion scaling figures and architecture diagrams for the sovereignty stack."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sovereignty-figures = "sovereignty_figures.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sovereignty_figures = ["*.md"]
